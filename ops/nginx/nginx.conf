# nginx for the self-hosted server (ADR-0007). Run by pm2 (ecosystem.config.cjs) as
#   nginx.exe -p C:\nginx\ -c <repo>\ops\nginx\nginx.conf
# Public entry point on port 80; the Next app listens on 127.0.0.1:3001 only.
# Test after edits:  C:\nginx\nginx.exe -p C:\nginx\ -c <repo>\ops\nginx\nginx.conf -t
# Apply:             pm2 restart nginx

worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    access_log logs/access.log;

    upstream flashd_app {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    server {
        listen 80 default_server;
        server_name _;

        # Videos upload in one request (local storage driver); PRD §10 caps a source video at 2 GB.
        client_max_body_size 2100m;
        client_body_timeout 600s;
        # Stream request and response bodies (uploads, Range video playback) instead of buffering to disk.
        proxy_request_buffering off;
        proxy_buffering off;

        location / {
            proxy_pass http://flashd_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}
