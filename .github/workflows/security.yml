name: security

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev
      - name: No env files or media in the diff
        run: |
          base="origin/${{ github.base_ref }}"
          bad=$(git diff --name-only --diff-filter=AM "$base"...HEAD \
            | grep -E '(^|/)\.env($|\.)|\.(mp4|mov|webm)$' \
            | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "These files must not be committed:"
            echo "$bad"
            exit 1
          fi
